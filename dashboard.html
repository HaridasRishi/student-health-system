<!-- dashboard.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Student Health Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h2>Welcome, <span id="studentName"></span></h2>
    
    <h3>Health Info</h3>
    <input type="text" id="bloodGroup" placeholder="Blood Group" />
    <input type="text" id="allergies" placeholder="Allergies" />
    <textarea id="conditions" placeholder="Chronic Conditions"></textarea>
    <button onclick="saveHealthProfile()">Save</button>
    <button onclick="logout()" style="background-color: crimson; color: white;">Logout</button>

    <h4>Saved Profile:</h4>
    <pre id="savedProfile"></pre>
  </div>

  <script src="script.js"></script>
</body>
</html>
